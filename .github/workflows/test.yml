name: Test DDPM mathematics and viewer API
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: node --input-type=module --check < web/app.js
      - run: node --input-type=module --check < web/charts.js
