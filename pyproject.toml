[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noise-to-vogue"
version = "1.0.0"
description = "A Fashion-MNIST DDPM lab: watch a wardrobe emerge from noise"
requires-python = ">=3.10"
dependencies = ["torch>=2.4,<3", "numpy>=1.26,<3", "Pillow>=10,<13", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["noise_to_vogue*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
